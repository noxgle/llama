services:
  llama-server:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      args:
        LLAMA_REPO: "${LLAMA_REPO:-https://github.com/ggml-org/llama.cpp.git}"
        LLAMA_REF: "${LLAMA_REF:-master}"
        LLAMA_NATIVE: "${LLAMA_NATIVE:-OFF}"
        BUILD_JOBS: "6"
    image: ghcr.io/noxgle/llama-server:b10213
    ports:
      - "${PORT:-8089}:${PORT:-8089}"
    volumes:
      - hf-cache:/root/.cache/huggingface
      - ./models:/models:ro
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - GGML_CUDA_GRAPH_OPT=${GGML_CUDA_GRAPH_OPT:-1}
      # Draft model via env (b10213+ rejects empty CLI values). Empty = unused.
      # -md equivalent: LLAMA_ARG_SPEC_DRAFT_MODEL=<path>; --hf-repo-draft: LLAMA_ARG_SPEC_DRAFT_HF_REPO=<repo:quant>
      - LLAMA_ARG_SPEC_DRAFT_MODEL=${DRAFT_MODEL:-}
      - LLAMA_ARG_SPEC_DRAFT_HF_REPO=${DRAFT_HF_REPO:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint:
      # b10213+ rejects empty argv elements (e.g. unset NO_HOST/MMPROJ/DRAFT_MODEL
      # default to "" in compose). Bash wrapper filters empty args, then execs.
      - /bin/bash
      - -c
      - 'args=(); for a in "$$@"; do [ -n "$$a" ] && args+=("$$a"); done; exec /usr/local/bin/llama-server "$${args[@]}"'
      - llama-server
    command:
      # -hf for HuggingFace repo:ref, OR -m /path/to/model.gguf (set MODEL_FLAG=-m)
      - "${MODEL_FLAG:--hf}"
      - "${MODEL:-unsloth/gemma-4-E4B-it-GGUF:UD-Q4_K_XL}"
      - "--jinja"
      - "-c"
      - "${CTX:-65536}"
      - "-n"
      - "${N_PREDICT:--1}"
      - "--port"
      - "${PORT:-8089}"
      - "--host"
      - "${HOST:-0.0.0.0}"
      - "-ngl"
      - "${NGLAYERS:-40}"
      - "-ot"
      - "${CPUMOE:-exps=CPU}"
      - "-fa"
      - "${FLASHATTN:-on}"
      - "-b"
      - "${BATCH:-1024}"
      - "-ub"
      - "${UBATCH:-1024}"
      - "-t"
      - "${THREADS:-6}"
      - "--threads-batch"
      - "${THREADS_BATCH:-6}"
      - "--parallel"
      - "${PARALLEL:-2}"
      - "--poll"
      - "${POLL:-50}"
      - "--mlock"
      - "--fit"
      - "off"
      - "-ctk"
      - "${CACHE_TYPE_K:-q4_0}"
      - "-ctv"
      - "${CACHE_TYPE_V:-q4_0}"
      - "--no-mmap"
      - "--ctx-checkpoints"
      - "${CTX_CHECKPOINTS:-4}"
      # Multimodal projector: set MMPROJ_FLAG=--mmproj, MMPROJ=/path/to/mmproj.gguf
      # (merged into one argv element — b10213+ rejects trailing empty values)
      - "${MMPROJ_FLAG:---no-mmproj}${MMPROJ:+=$MMPROJ}"
      # Image token limits for multimodal (low = fast encoding, less detail)
      - "--image-min-tokens"
      - "${IMAGE_MIN_TOKENS:-66}"
      - "--image-max-tokens"
      - "${IMAGE_MAX_TOKENS:-256}"
      # Reasoning/thinking: off for fast camera loop, auto for others
      - "--reasoning"
      - "${REASONING:-auto}"
      # Batch limit for image encoding (0 = no limit / model default)
      - "--mtmd-batch-max-tokens"
      - "${MTMD_BATCH_MAX_TOKENS:-0}"
      # Bypass host buffer, freeing more VRAM for GPU compute (empty = filtered by entrypoint)
      - "${NO_HOST:-}"
      - "--cache-ram"
      - "${CACHE_RAM:-4096}"
      - "--cache-reuse"
      - "${CACHE_REUSE:-256}"
      - "--chat-template-kwargs"
      - '{"preserve_thinking": false}'
      - "--threads-http"
      - "${THREADS_HTTP:-2}"
      # MTP speculative decoding (upstream PR #22673)
      - "--spec-type"
      - "${SPEC_TYPE:-none}"
      - "--spec-draft-n-max"
      - "${SPEC_DRAFT_N_MAX:-3}"
      # Draft model: pass via env above (DRAFT_MODEL=<path> for local file,
      # DRAFT_HF_REPO=<user>/<model>[:quant] for HF repo)
      - "--gpu-layers-draft"
      - "${GPU_LAYERS_DRAFT:-0}"
      - "--spec-draft-n-min"
      - "${SPEC_DRAFT_N_MIN:-0}"
      - "--spec-draft-p-min"
      - "${SPEC_DRAFT_P_MIN:-0.0}"

volumes:
  hf-cache:
